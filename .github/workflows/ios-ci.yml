name: iOS CI

# 🎯 PRIMARY CI WORKFLOW
# Comprehensive CI pipeline following GitHub Actions best practices
# Runs on all branches to catch issues early
# Includes: Build, Test, SwiftLint, Security, Architecture Quality

on:
  push:
    branches: [ "**" ]  # Run on all branches
  pull_request:
    branches: [ "**" ]  # Run on all PRs
  workflow_dispatch:    # Allow manual trigger for debugging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.1"
  MACOS_VERSION: "macos-15"
  IOS_SIMULATOR: "iPhone 17 Pro"
  DEPLOYMENT_TARGET: "18.1"
  CACHE_VERSION: v1

jobs:
  # STAGE 1: Quick validation checks (fail fast)
  validate:
    name: Validate & Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-needed: ${{ steps.changes.outputs.build }}
      lint-needed: ${{ steps.changes.outputs.lint }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff checks

      - name: Check Changed Files
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running on PR: comparing with origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            echo "Running on push: checking last 2 commits"
            changed_files=$(git diff --name-only HEAD~1...HEAD || git diff --name-only HEAD)
          fi
          
          echo "Changed files:"
          echo "$changed_files"
          
          # Check what needs to run
          has_swift=$(echo "$changed_files" | grep -E '\.(swift|xcodeproj|pbxproj|xcconfig)$' || true)
          has_lint=$(echo "$changed_files" | grep -E '\.(swift|yml)$' || true)
          
          [ -n "$has_swift" ] && echo "build=true" >> $GITHUB_OUTPUT || echo "build=false" >> $GITHUB_OUTPUT
          [ -n "$has_lint" ] && echo "lint=true" >> $GITHUB_OUTPUT || echo "lint=false" >> $GITHUB_OUTPUT

  # STAGE 2: Lint checks (parallelizable, fast)
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          else
            echo "SwiftLint already installed: $(swiftlint version)"
          fi

      - name: Run SwiftLint
        run: |
          echo "🔍 Running SwiftLint analysis..."
          swiftlint lint --reporter github-actions-logging 2>&1 || true
          swiftlint lint --reporter json > swiftlint-report.json 2>&1 || true

      - name: Analyze Results
        run: |
          if command -v jq &> /dev/null; then
            error_count=$(jq '[.[] | select(.severity == "Error")] | length' swiftlint-report.json)
            warning_count=$(jq '[.[] | select(.severity == "Warning")] | length' swiftlint-report.json)
            echo "## SwiftLint Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: $error_count" >> $GITHUB_STEP_SUMMARY
            echo "- **Warnings**: $warning_count" >> $GITHUB_STEP_SUMMARY
            
            if [ "$error_count" -gt 0 ]; then
              echo "❌ SwiftLint found $error_count errors"
              jq '[.[] | select(.severity == "Error")] | .[] | "\(.file):\(.line): \(.reason)"' -r swiftlint-report.json
              exit 1
            fi
            echo "✅ No SwiftLint errors found"
          fi

      - name: Upload SwiftLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftlint-report-${{ github.run_id }}
          path: swiftlint-report.json
          retention-days: 30

  # STAGE 3: Security checks (parallelizable)
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Secrets
        run: |
          echo "🔐 Scanning for hardcoded secrets..."
          
          EXCLUDE_PATHS="Tests|Test|Mock|Template|template|\.disabled|Scripts|Documentation"
          
          # Google API keys
          api_keys=$(grep -rE "AIza[0-9A-Za-z_-]{35}" --include="*.swift" PayslipMax/ 2>/dev/null | grep -vE "$EXCLUDE_PATHS" || true)
          if [ -n "$api_keys" ]; then
            if echo "$api_keys" | grep -q "Config/APIKeys.swift"; then
              echo "✅ API key found only in gitignored Config/APIKeys.swift"
            else
              echo "❌ API key exposed in tracked source code!"
              echo "$api_keys"
              exit 1
            fi
          fi
          
          # Hardcoded credentials
          credentials=$(grep -rEi "(password|secret|api_key|apikey)\s*=\s*[\"'][^\"']+[\"']" --include="*.swift" PayslipMax/ 2>/dev/null | grep -vE "$EXCLUDE_PATHS|placeholder|example|YOUR_" || true)
          if [ -n "$credentials" ]; then
            echo "❌ Potential credentials found: $credentials"
            exit 1
          fi
          
          echo "✅ No secrets detected"

      - name: Verify GitIgnore
        run: |
          echo "🔍 Checking .gitignore protection..."
          critical_patterns=("Config/APIKeys.swift" "GoogleService-Info.plist" "*.xcuserdata")
          
          for pattern in "${critical_patterns[@]}"; do
            if grep -q "$pattern" .gitignore; then
              echo "✅ $pattern is properly ignored"
            else
              echo "⚠️  $pattern not in .gitignore"
            fi
          done

  # STAGE 4: Build & Test (main, slower step)
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 60
    needs: [validate, swiftlint, security]
    continue-on-error: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Select Latest Simulator
        id: simulator
        run: |
          echo "📱 Finding available iOS simulator..."
          
          # Try to find iPhone 17 Pro
          if xcrun simctl list devices | grep -q "iPhone 17 Pro"; then
            DEVICE="iPhone 17 Pro"
            echo "✅ Using $DEVICE"
          else
            # Fallback to first available iPhone
            DEVICE=$(xcrun simctl list devices available | grep -i "iphone" | head -1 | sed 's/.*(\([^)]*\)).*/\1/' | xargs)
            if [ -z "$DEVICE" ]; then
              DEVICE="iPhone 17 Pro"  # Default
              echo "⚠️  Using default device: $DEVICE"
            else
              echo "✅ Using available device: $DEVICE"
            fi
          fi
          
          echo "destination=platform=iOS Simulator,name=$DEVICE" >> $GITHUB_OUTPUT

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}-v1
          restore-keys: |
            ${{ runner.os }}-spm-v1-

      - name: Cache Xcode Build
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/PayslipMax-*/Build
          key: ${{ runner.os }}-xcode-build-${{ github.sha }}-v1
          restore-keys: |
            ${{ runner.os }}-xcode-build-v1-

      - name: Resolve SPM Dependencies
        run: |
          echo "📦 Resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies \
            -project PayslipMax.xcodeproj \
            -scheme PayslipMax \
            -verbose 2>&1 | head -50

      - name: Generate APIKeys.swift for CI
        run: |
          mkdir -p Config
          cat > Config/APIKeys.swift <<'EOF'
          import Foundation
          
          struct APIKeys {
              static let geminiAPIKey = ProcessInfo.processInfo.environment["GEMINI_API_KEY"] ?? "CI_BUILD_PLACEHOLDER"
              static var isGeminiConfigured: Bool {
                  return !geminiAPIKey.isEmpty &&
                         geminiAPIKey != "CI_BUILD_PLACEHOLDER" &&
                         geminiAPIKey.hasPrefix("AIza")
              }
              static let openAIAPIKey = ""
              static var isOpenAIConfigured: Bool { false }
          }
          EOF
          echo "✅ Generated APIKeys.swift for CI build"

      - name: Build for Testing
        run: |
          DESTINATION="${{ steps.simulator.outputs.destination }}"
          echo "🔨 Building project with destination: $DESTINATION"
          
          xcodebuild build-for-testing \
            -project PayslipMax.xcodeproj \
            -scheme PayslipMax \
            -destination "$DESTINATION" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath DerivedData \
            -verbose 2>&1 | tail -50

      - name: Run Unit Tests
        run: |
          DESTINATION="${{ steps.simulator.outputs.destination }}"
          echo "🧪 Running unit tests with destination: $DESTINATION"
          
          xcodebuild test-without-building \
            -project PayslipMax.xcodeproj \
            -scheme PayslipMax \
            -destination "$DESTINATION" \
            -sdk iphonesimulator \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData 2>&1 | tail -100

      - name: Extract Test Summary
        if: always()
        run: |
          if [ -d "TestResults.xcresult" ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            # Extract from xcresult
            xcrun xcresulttool get --format json TestResults.xcresult 2>/dev/null | \
              jq '.summaries[0] | "- Tests Run: \(.testsCount)\n- Failures: \(.failureCount)\n- Skipped: \(.skipCount)"' -r >> $GITHUB_STEP_SUMMARY || \
              echo "- Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            TestResults.xcresult
          retention-days: 30

      - name: Upload Code Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          xcode: true
          xcode_archive_path: TestResults.xcresult
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # STAGE 5: Architecture Quality checks
  architecture:
    name: Architecture Quality
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [validate]
    continue-on-error: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: |
          chmod +x Scripts/architecture-guard.sh || true
          chmod +x Scripts/pre-commit-enforcement.sh || true
          chmod +x Scripts/debt-trend-monitor.sh || true

      - name: Run Architecture Quality Check
        id: arch-check
        run: |
          echo "🏗️  Checking architecture compliance..."
          ./Scripts/architecture-guard.sh --ci-mode 2>&1 || echo "arch_failed=true" >> $GITHUB_OUTPUT
          violations=$(./Scripts/architecture-guard.sh --count-violations 2>&1 | grep -E '^[0-9]+$' | tail -1 || echo "0")
          echo "violations=$violations" >> $GITHUB_OUTPUT

      - name: Generate Architecture Report
        if: always()
        run: |
          ./Scripts/architecture-guard.sh --report > architecture-report.md 2>&1 || touch architecture-report.md
          echo "## Architecture Analysis" >> $GITHUB_STEP_SUMMARY
          cat architecture-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Architecture Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-report-${{ github.run_id }}
          path: architecture-report.md
          retention-days: 30

  # STAGE 6: Status check (final gate)
  status:
    name: CI Status
    if: always()
    needs: [validate, swiftlint, security, build-and-test, architecture]
    runs-on: ubuntu-latest
    
    steps:
      - name: Check All Checks
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftLint | ${{ needs.swiftlint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ needs.architecture.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if any required check failed
          if [ "${{ needs.swiftlint.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.build-and-test.result }}" == "failure" ] || \
             [ "${{ needs.architecture.result }}" == "failure" ]; then
            echo ""
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          
          echo ""
          echo "✅ All CI checks passed!"
